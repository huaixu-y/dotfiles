unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

run-shell 'tmux set-option -g default-shell "$(command -v nu 2>/dev/null || command -v fish 2>/dev/null || command -v zsh 2>/dev/null || echo /bin/sh)"'

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g aggressive-resize on
set -g detach-on-destroy off

set -g history-limit 10000
set -s escape-time 10

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features '*:RGB'
set -g focus-events on

# Yazi preview picture (Kitty Protocol)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# bind c new-window -c "#{pane_current_path}"

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# macOS:
# bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# wayland
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# set -g pane-scrollbars modal
# set -g pane-scrollbars-position right
# set -g pane-scrollbars-style fg=colour248,bg=colour236

bind r source-file ~/.config/tmux/tmux.conf \; display "Reload tmux config!!!"

bind C-p display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E "tmux new-session -A -s popup"

bind g display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E "lazygit"

bind v display-popup -d "#{pane_current_path}" -xC -yC -w 90% -h 90% -E "nvim"

bind / display-menu -T "Command" -xC -yC \
    "btop"    b "display-popup -E -xC -yC -w 90% -h 90% btop" \
    "lazygit" g "display-popup -E -xC -yC -d '#{pane_current_path}' -w 90% -h 90% lazygit" \
    "nvim"    v "display-popup -E -xC -yC -d '#{pane_current_path}' -w 90% -h 90% nvim" \
    "close"   q ""
